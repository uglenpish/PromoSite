services:
  postgres:
    image: postgres:16-alpine
    container_name: promo-site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promo_site
      POSTGRES_USER: promo_user
      POSTGRES_PASSWORD: promo_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
